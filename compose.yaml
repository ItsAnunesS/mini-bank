services:
  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    platform: linux/amd64
    hostname: db2
    cap_add:
      - IPC_OWNER
      - SYS_RESOURCE
    mem_limit: 6g
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?Define DB2_PASSWORD no ficheiro .env}
      DBNAME: DESPESAS
      BLU: 'false'
      ENABLE_ORACLE_COMPATIBILITY: 'false'
      UPDATEAVAIL: 'NO'
      TO_CREATE_SAMPLEDB: 'false'
      REPODB: 'false'
      IS_OSXFS: 'false'
      PERSISTENT_HOME: 'true'
      HADR_ENABLED: 'false'
    volumes:
      - db2-data:/database
    healthcheck:
      test: [CMD-SHELL, "su - db2inst1 -c 'db2 connect to DESPESAS >/dev/null && db2 connect reset >/dev/null'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
  db-init:
    build:
      context: .
      target: runtime
    entrypoint: [/opt/venv/bin/python, -m, ledger.cli, init]
    environment: &db-env
      DB2_HOST: db2
      DB2_DATABASE: DESPESAS
      DB2_USER: db2inst1
      DB2_PASSWORD: ${DB2_PASSWORD:?Define DB2_PASSWORD no ficheiro .env}
    depends_on:
      db2:
        condition: service_healthy
  despesas:
    build:
      context: .
      target: runtime
    stdin_open: true
    tty: true
    environment: *db-env
    depends_on:
      db-init:
        condition: service_completed_successfully

  integration-tests:
    profiles: [test]
    build:
      context: .
      target: integration-tests
    environment: *db-env
    depends_on:
      db-init:
        condition: service_completed_successfully

  bank-init:
    build:
      context: .
      target: runtime
    entrypoint: [/opt/venv/bin/python, -m, bank.cli, init]
    environment: *db-env
    depends_on:
      db2:
        condition: service_healthy
  bank:
    build:
      context: .
      target: bank-web
    ports:
      - '127.0.0.1:8088:8000'
    environment:
      <<: *db-env
      BANK_SECRET_KEY: ${BANK_SECRET_KEY:?Define BANK_SECRET_KEY no ficheiro .env}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      bank-init:
        condition: service_completed_successfully
  bank-admin:
    profiles: [tools]
    build:
      context: .
      target: runtime
    entrypoint: [/opt/venv/bin/python, -m, bank.cli, create-admin]
    stdin_open: true
    tty: true
    environment: *db-env
    depends_on:
      bank-init:
        condition: service_completed_successfully
  bank-tests:
    profiles: [test]
    build:
      context: .
      target: bank-tests
    environment:
      <<: *db-env
      BANK_SECRET_KEY: ${BANK_SECRET_KEY:?Define BANK_SECRET_KEY no ficheiro .env}
    depends_on:
      bank-init:
        condition: service_completed_successfully

volumes:
  db2-data:
